<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reliable Premium Marketplace</title>
<style>
*{box-sizing:border-box} html,body{height:100%;margin:0}
.slide-container{width:1280px;min-height:720px;background:#0F2F57;color:#fff;position:relative;overflow:hidden;font-family:Arial,Helvetica,sans-serif;padding:78px 86px 0;display:flex;align-items:center}
.left{width:62%;padding-top:6px}
.eyebrow{font-size:17px;letter-spacing:4px;color:#67E8E0;font-weight:700;margin-bottom:22px}
.title{font-size:70px;line-height:1.02;font-weight:800;letter-spacing:-2px;margin:0 0 20px}
.subtitle{font-size:25px;line-height:1.35;color:#D6E3F0;max-width:610px;font-weight:300;margin-bottom:0}
.meta{margin-top:36px;color:#9FB6CC;font-size:16px;letter-spacing:1.4px}
.brand{width:38%;height:430px;display:flex;align-items:center;justify-content:center;position:relative}
.brand:before{content:"";position:absolute;width:380px;height:380px;border-radius:50%;background:#12B8B0;right:-72px;bottom:-28px;opacity:.92}
.brand:after{content:"";position:absolute;width:210px;height:210px;border:1px dotted rgba(255,255,255,.65);border-radius:50%;right:28px;bottom:52px}
.brand img{width:260px;height:260px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 16px 26px rgba(0,0,0,.22))}
.line{position:absolute;left:86px;right:86px;bottom:54px;border-top:1px dotted rgba(255,255,255,.44)}
.tag{position:absolute;right:88px;bottom:30px;background:#0F2F57;padding:0 12px;color:#BFD2E4;font-size:13px;letter-spacing:2px}
</style>
</head>
<body>
<div class="slide-container">
  <div class="left"><div class="eyebrow">RELIABLE · MARKETPLACE OPERATING SYSTEM</div><h1 class="title">Reliable<br/>Premium Marketplace</h1><p class="subtitle">A trusted digital marketplace for customers, sellers, and communities.</p><div class="meta">Company and platform overview · August 2026</div></div>
  <div class="brand"><img src="/home/ubuntu/Blue-Water-Shopping-Village-1/public/logo-transparent.png" alt="Reliable logo" /></div>
  <div class="line"></div><div class="tag">DISCOVER WITH CONFIDENCE</div>
</div>
</body>
</html>
